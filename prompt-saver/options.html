<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Prompt Saver - Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h1 class="page-title" data-i18n="extName">Prompt Saver</h1>
    <p class="page-desc" data-i18n="extDescription"></p>

    <div class="section">
      <label class="label" data-i18n="language"></label>
      <select id="language" class="select">
        <option value="zh_CN" data-i18n="langZh"></option>
        <option value="en" data-i18n="langEn"></option>
      </select>
    </div>

    <div class="section">
      <h2 class="section-title" data-i18n="githubToken"></h2>
      <input type="password" id="githubToken" class="input" data-i18n-placeholder="githubTokenPlaceholder">
    </div>

    <div class="section">
      <label class="label" data-i18n="githubOwner"></label>
      <input type="text" id="githubOwner" class="input" data-i18n-placeholder="githubOwnerPlaceholder">
    </div>

    <div class="section">
      <label class="label" data-i18n="githubRepo"></label>
      <input type="text" id="githubRepo" class="input" data-i18n-placeholder="githubRepoPlaceholder">
    </div>

    <div class="section">
      <label class="label" data-i18n="repoMode"></label>
      <div class="radio-group">
        <label class="radio-label">
          <input type="radio" name="repoMode" value="existing" checked>
          <span data-i18n="repoModeExisting"></span>
        </label>
        <label class="radio-label">
          <input type="radio" name="repoMode" value="create">
          <span data-i18n="repoModeCreate"></span>
        </label>
      </div>
    </div>

    <div class="section" id="createOptions" style="display:none;">
      <label class="label" data-i18n="repoDescription"></label>
      <input type="text" id="repoDescription" class="input" data-i18n-placeholder="repoDescriptionPlaceholder">

      <label class="checkbox-label" style="margin-top: 12px;">
        <input type="checkbox" id="repoPrivate">
        <span data-i18n="repoPrivate"></span>
      </label>
    </div>

    <div class="btn-group">
      <button id="testBtn" class="btn btn-secondary" data-i18n="testConnection"></button>
      <button id="saveBtn" class="btn btn-primary" data-i18n="save"></button>
    </div>

    <div id="message" class="message" style="display:none;"></div>
  </div>

  <script src="github.js"></script>
  <script src="options.js"></script>
</body>
</html>
